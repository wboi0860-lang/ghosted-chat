name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build APK
        run: |
         mkdir -p www
         cp index.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Ghosted Chat" com.ghosted.chat --web-dir=www
          npx cap add android
          npx cap sync android
         echo "configurations.all { resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22','org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22','org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22' }" >> android/app/build.gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ghosted-chat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
