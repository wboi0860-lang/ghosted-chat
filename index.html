<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdMob Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f1f3f4;padding:16px}
.top{background:#fff;padding:16px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.top h1{font-size:20px;color:#1a73e8}
.top p{font-size:12px;color:#666}
.top button{background:#1a73e8;color:#fff;border:0;padding:10px 16px;border-radius:20px;font-weight:bold}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.card{background:#fff;padding:16px;border-radius:12px}
.card small{color:#666}
.card h2{font-size:22px;margin:6px 0}
.card span{color:green;font-size:12px}
.box{background:#fff;padding:16px;border-radius:12px;margin-bottom:16px}
.box h3{margin-bottom:12px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:14px}
.row b{color:#333}
input,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
.add{background:#188038;color:#fff;border:0;padding:12px;border-radius:8px;width:100%;font-weight:bold;margin-top:8px}
</style>
</head>
<body>

<div class="top">
<div><h1>AdMob Dashboard</h1><p>Welcome back • Today</p></div>
<button>+ New App</button>
</div>

<div class="cards">
<div class="card"><small>Estimated Earnings</small><h2>$12.48</h2><span>▲ 12% vs yesterday</span></div>
<div class="card"><small>Impressions</small><h2>8,420</h2><span>▲ 8% vs yesterday</span></div>
<div class="card"><small>Clicks</small><h2>312</h2><span>▲ 5% vs yesterday</span></div>
<div class="card"><small>eCPM</small><h2>$1.48</h2><span>▲ 2% vs yesterday</span></div>
</div>

<div class="box">
<h3>Your Apps</h3>
<div class="row"><span>📱 My First App</span><b>$8.20</b></div>
<div class="row"><span>🎮 Game App</span><b>$4.28</b></div>
<div class="row"><span>📰 News App</span><b>$0.00</b></div>
</div>

<div class="box">
<h3>Add Earning</h3>
<input id="app" placeholder="App name e.g My First App">
<input id="amount" type="number" placeholder="Amount e.g 5.50">
<button class="add" onclick="addEarn()">Add Earning</button>
<p id="msg" style="text-align:center;margin-top:10px;color:green"></p>
</div>

<script>
function addEarn(){
  let a=document.getElementById('app').value;
  let m=document.getElementById('amount').value;
  if(!a||!m){alert('Fill app and amount');return;}
  document.getElementById('msg').innerText='Saved: '+a+' - $'+m;
  document.getElementById('app').value='';
  document.getElementById('amount').value='';
}
</script>
</body>
</html>
